name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }}, ${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: g++ }
          - { os: ubuntu-latest, cxx: clang++ }
          - { os: macos-latest, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: make CXX=${{ matrix.cxx }} test
      - name: Scenario simulations (every sim/scenarios/*.scn)
        # The sims are random processes driven by a portable generator, but the
        # trajectory also depends on libm's last bits (sin, atan2, exp), which
        # differ between glibc and Apple's libm. The checks are gated on Linux;
        # macOS runs them for information.
        run: make CXX=${{ matrix.cxx }} scenarios || [ "$RUNNER_OS" = "macOS" ]
      - name: Simulation is deterministic
        run: |
          for f in sim/scenarios/storyline6.scn sim/scenarios/pack16.scn; do
            ./build/pack_sim --quiet "$f" > run1.txt || true
            ./build/pack_sim --quiet "$f" > run2.txt || true
            diff run1.txt run2.txt
          done
      - name: Flight-library audit
        run: make audit
      - name: Fuzz corpus replay (ASan + UBSan, this compiler)
        run: make CXX=${{ matrix.cxx }} fuzz-regress

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests and simulation under sanitizers
        run: make CXX=clang++ check

  monte-carlo:
    name: Monte Carlo smoke (20 trials per scenario)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monte Carlo
        run: make mc TRIALS=20
      - name: Keep the distributions
        uses: actions/upload-artifact@v4
        with:
          name: monte-carlo
          path: build/mc-*.json

  fuzz:
    name: fuzz (libFuzzer + ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clang fuzzer runtime
        run: |
          ver=$(clang++ --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p')
          sudo apt-get update -qq
          sudo apt-get install -y -qq "libclang-rt-${ver}-dev" || true
      - name: Fuzz the decoder and receive path for 120 s
        run: make fuzz FUZZ_SECONDS=120
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build-fuzz/artifacts/
          if-no-files-found: ignore

  cmake:
    name: CMake build + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build-cmake --parallel
      - name: Test
        run: ctest --test-dir build-cmake --output-on-failure

  static-analysis:
    name: clang-tidy + cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck
          pip install --user clang-tidy==23.1.4
      - name: Compilation database
        run: cmake -S . -B build-cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy (config in .clang-tidy, warnings are errors)
        run: |
          for f in src/*.cpp; do
            echo "::group::$f"
            clang-tidy -quiet -p build-cmake "$f"
            echo "::endgroup::"
          done
      - name: cppcheck
        run: |
          cppcheck --std=c++17 --language=c++ --enable=warning,performance,portability \
            --inline-suppr --suppress=missingIncludeSystem --error-exitcode=1 \
            -Iinclude src include
